<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15262B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<title>Caderneta — cartões e empréstimos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#E9EEEC; --sheet:#FAFBFA; --sheet-2:#F1F5F3; --ink:#15262B; --ink-2:#51646A; --ink-3:#7F9095;
  --rule:#CAD5D1; --rule-2:#DFE6E3;
  --owed:#A94F08; --paid:#1B7550; --credit:#2A5DB0; --stamp:#9E2A4E; --focus:#2457C5;
  --warn-bg:#FBEFD9; --warn:#8A4B00;
  --r-sm:6px; --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1719; --sheet:#172225; --sheet-2:#1C292C; --ink:#E2EBE8; --ink-2:#9FB1AE; --ink-3:#71827F;
    --rule:#2D3C3F; --rule-2:#233033;
    --owed:#F0A45E; --paid:#5CC795; --credit:#7FA8F0; --stamp:#EE7C9F; --focus:#8DB0FF;
    --warn-bg:#3A2A12; --warn:#F2C27A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1719; --sheet:#172225; --sheet-2:#1C292C; --ink:#E2EBE8; --ink-2:#9FB1AE; --ink-3:#71827F;
  --rule:#2D3C3F; --rule-2:#233033;
  --owed:#F0A45E; --paid:#5CC795; --credit:#7FA8F0; --stamp:#EE7C9F; --focus:#8DB0FF;
  --warn-bg:#3A2A12; --warn:#F2C27A; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 10px 18px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0}
.nav-btn{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:var(--r-sm);padding:9px 10px;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:600}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--sheet-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--paper)}
.save-state{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 10px}
.save-state b{font-weight:600}
.save-state.err{color:var(--stamp)}

main{min-width:0;padding:0 28px 60px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.month{display:flex;align-items:center;gap:4px}
.month h1{margin:0 6px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em;min-width:0}
.month h1 span{font-weight:400;color:var(--ink-3);margin-left:.3em}
.month input[type=month]{position:absolute;opacity:0;pointer-events:none;width:1px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--sheet);border-radius:50%;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--ink-3)}
.icon-btn svg{width:16px;height:16px}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--stamp)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:2px 4px;color:var(--focus)}
.btn svg{width:15px;height:15px}

h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0}
h3{font-size:15px;font-weight:700;margin:0}
.sec{margin:0 0 30px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head p{margin:0;color:var(--ink-3);font-size:13px}
.sec-head .spacer{flex:1}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.owed{color:var(--owed)} .paid{color:var(--paid)} .credit{color:var(--credit)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:28px}

/* números de destaque */
.ledger-head{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:0;border-top:3px double var(--ink);border-bottom:1px solid var(--rule);margin-bottom:28px}
.ledger-head > div{padding:14px 16px 14px 0}
.ledger-head > div + div{padding-left:16px;border-left:1px solid var(--rule-2)}
.ledger-head .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
.ledger-head .val{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ledger-head .big .val{font-size:40px;font-weight:800;line-height:1.1;color:var(--owed)}
.ledger-head .hint{font-size:12px;color:var(--ink-3)}

/* tabelas */
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:middle}
th{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--sheet-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:800;border-top:2px solid var(--rule);border-bottom:0;background:var(--sheet-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sheet-2)}
tr.sel td{background:var(--sheet-2)}
tr.dim td{color:var(--ink-3)}
td input,td select,dd input,dd select{width:100%;min-width:70px;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px}
td input:hover,td select:hover,dd input:hover{border-color:var(--rule)}
td input:focus,td select:focus,dd input:focus{border-color:var(--focus);background:var(--sheet);outline:none}
td input.num,dd input.num{text-align:right}
dd input{min-width:0;border-color:var(--rule)}
td input.proj::placeholder{color:var(--ink-3);font-style:italic}
td .row-actions{display:flex;gap:2px;justify-content:flex-end}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* carimbos — o elemento marcante */
.stamp{display:inline-block;border:2px solid currentColor;border-radius:4px;padding:0 7px;font-size:12px;font-weight:800;line-height:18px;transform:rotate(-3deg);letter-spacing:.01em;white-space:nowrap}
.stamp.quitado{color:var(--paid)}
.stamp.aberto{color:var(--stamp)}
.stamp.parcial{color:var(--owed);border-style:dashed}
.stamp.credito{color:var(--credit)}
.stamp.big{font-size:16px;line-height:26px;padding:0 12px;border-width:3px}

.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--sheet-2);border:1px solid var(--rule)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:0;margin:0}
dl.kv dt,dl.kv dd{margin:0;padding:7px 0;border-bottom:1px dashed var(--rule-2)}
dl.kv dd{text-align:right;font-weight:700}
dl.kv dt small{display:block;color:var(--ink-3);font-size:12px}
dl.kv .tot{border-bottom:0;border-top:2px solid var(--ink);font-weight:800}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);padding:7px 9px;font-size:14px;font-weight:500;color:var(--ink);min-width:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 11px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* devedores */
.dev-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.dev-list{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;position:sticky;top:90px}
.dev-list button{display:flex;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--rule-2);background:none;padding:9px 12px;cursor:pointer;text-align:left}
.dev-list button:last-child{border-bottom:0}
.dev-list button:hover{background:var(--sheet-2)}
.dev-list button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.dev-list button[aria-current="true"] .owed{color:inherit}
.dev-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dev-title h2{font-size:32px;letter-spacing:-.03em}
.months-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.months-strip button{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);padding:8px;text-align:left;cursor:pointer}
.months-strip button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.months-strip .m{font-size:12px;color:var(--ink-3);font-weight:600}
.months-strip .v{font-weight:700}
.bar{height:4px;background:var(--rule-2);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--owed)}

.lanc-list .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:10px 14px;border-bottom:1px solid var(--rule-2)}
.lanc-list .item:last-child{border-bottom:0}
.lanc-list .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lanc-list .meta{font-size:13px;color:var(--ink-3)}
.lanc-list .amt{text-align:right;font-weight:700}
.lanc-list .prog{height:3px;background:var(--rule-2);border-radius:2px;margin-top:6px;grid-column:1/-1;overflow:hidden}
.lanc-list .prog i{display:block;height:100%;background:var(--paid)}

.notice{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:10px 14px;font-size:14px;margin-bottom:14px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

dialog{border:0;border-radius:14px;padding:0;background:var(--sheet);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(900px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,22,.5)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--rule)}
.dlg-body{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto;max-height:calc(100vh - 170px)}
.dlg-body .full{grid-column:1/-1}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--rule)}
.dlg-foot .spacer{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.pick input{margin:0;accent-color:var(--ink)}
.pick label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.preview{border:1px dashed var(--rule);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;max-height:160px;overflow:auto}
.preview div{display:flex;justify-content:space-between;gap:10px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}

.tabs{display:none}
.app:has(.welcome){display:block}
.welcome{max-width:560px;margin:60px auto;padding:0 18px;text-align:left}
.welcome code{word-break:break-all;background:var(--sheet-2);padding:1px 5px;border-radius:4px}
.welcome h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:0 14px 90px}
  .month h1{font-size:23px}
  .ledger-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ledger-head .big{grid-column:1/-1}
  .ledger-head > div.big + div{border-left:0;padding-left:0;border-top:1px solid var(--rule-2)}
  .ledger-head > div:nth-child(n+2){border-top:1px solid var(--rule-2)}
  .ledger-head > div:nth-child(4){border-left:0;padding-left:0}
  .ledger-head .big .val{font-size:30px}
  .dev-layout{grid-template-columns:minmax(0,1fr)}
  .dev-layout > div{min-width:0}
  .grid2 > *{min-width:0}
  .dev-list{position:static;flex-direction:row;overflow-x:auto}
  .dev-list button{border-bottom:0;border-right:1px solid var(--rule-2);flex-direction:column;gap:0;white-space:nowrap}
  .months-strip{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
  .dlg-body{grid-template-columns:1fr}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--sheet);border-top:1px solid var(--rule);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabs .nav-btn{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}


</style>
</head>
<body>
<div id="app" class="app"></div>
<dialog id="dlg"></dialog>
<dialog id="conf"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Núcleo de cálculo — sem DOM ===== */
const Core = (() => {
  const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
  const pad = n => String(n).padStart(2, '0');
  const ym = (y, m) => `${y}-${pad(m)}`;
  const addMonths = (mes, k) => {
    const [y, m] = mes.split('-').map(Number);
    const t = y * 12 + (m - 1) + k;
    return ym(Math.floor(t / 12), (t % 12) + 1);
  };
  const daysIn = mes => { const [y, m] = mes.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  const dateIn = (mes, dia) => `${mes}-${pad(Math.min(dia, daysIn(mes)))}`;
  const monthDiff = (a, b) => { const [ya, ma] = a.split('-').map(Number); const [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

  const meioDe = (cfg, nome) => cfg.meios.find(m => m.n === nome);

  /* Vencimento da parcela k (regra da planilha, corrigida para o ano):
     compra antes do dia de fechamento → fatura do mês da compra; senão, do mês seguinte. */
  function vencimento(cfg, meioNome, dataISO, k, primeiraCobranca) {
    const meio = meioDe(cfg, meioNome);
    const mesCompra = dataISO.slice(0, 7);
    if (!meio || meio.t !== 'cartao') {
      // dinheiro/pix: primeira cobrança informada (ou próximo dia padrão) e depois mês a mês
      let first = primeiraCobranca;
      if (!first) {
        const dia = (meio && meio.v) || 15;
        const d = Number(dataISO.slice(8, 10));
        first = dateIn(d < dia ? mesCompra : addMonths(mesCompra, 1), dia);
      }
      return dateIn(addMonths(first.slice(0, 7), k - 1), Number(first.slice(8, 10)));
    }
    const d = Number(dataISO.slice(8, 10));
    const off = (k - 1) + (d < meio.f ? 0 : 1) + (meio.x || 0);
    return dateIn(addMonths(mesCompra, off), meio.v);
  }

  function gerarParcelas(cfg, { meio, data, total, n, inicio = 1, primeira }) {
    const out = [];
    const primeiraK = primeira ? primeira : null;
    for (let k = inicio; k <= n; k++) {
      let venc;
      if (primeiraK) venc = dateIn(addMonths(primeiraK.slice(0, 7), k - inicio), Number(primeiraK.slice(8, 10)));
      else venc = vencimento(cfg, meio, data, k);
      out.push([k, total / n, venc]);
    }
    return out;
  }

  /* Índices */
  function indexar(compras) {
    const porMes = new Map();
    for (const c of compras) {
      for (const p of c.p) {
        const mes = p[2].slice(0, 7);
        let a = porMes.get(mes); if (!a) porMes.set(mes, a = []);
        a.push({ c, k: p[0], v: p[1], venc: p[2] });
      }
    }
    return porMes;
  }

  function dataCobranca(cfg, cob, mes) {
    const meio = meioDe(cfg, cob.m);
    const fech = meio && meio.t === 'cartao' ? meio.f : 1;
    const alvo = cob.d < fech ? mes : addMonths(mes, -1);
    return dateIn(alvo, cob.d);
  }

  function resumo(cfg, idx, pags, mes, hoje = todayISO()) {
    const inst = idx.get(mes) || [];
    const eu = cfg.eu;
    const taxa = (cfg.taxa || 0) / 100;
    const fat = (cfg.fat && cfg.fat[mes]) || {};
    const devs = new Map();
    const get = n => { let o = devs.get(n); if (!o) devs.set(n, o = { n, devido: 0, pago: 0, dias: {}, qtd: 0 }); return o; };
    const cartoes = new Map(); let dinheiro = 0;
    for (const i of inst) {
      const o = get(i.c.d); o.devido += i.v; o.qtd++;
      const dia = Number(i.venc.slice(8, 10)); o.dias[dia] = (o.dias[dia] || 0) + i.v;
      const meio = meioDe(cfg, i.c.m);
      if (meio && meio.t === 'cartao') cartoes.set(i.c.m, (cartoes.get(i.c.m) || 0) + i.v);
      else dinheiro += i.v;
    }
    let recebido = 0;
    const pagsMes = pags.filter(p => p.f === mes);
    for (const p of pagsMes) { get(p.d).pago += p.v; recebido += p.v; }
    const linhas = [...devs.values()].map(o => {
      const saldo = o.devido - o.pago;
      return { ...o, saldo, comTaxa: o.devido * (1 + taxa) - o.pago, status: Math.abs(saldo) <= 0.01 ? 'quitado' : saldo < 0 ? 'credito' : (o.pago > 0 ? 'parcial' : 'aberto') };
    }).sort((a, b) => a.n.localeCompare(b.n, 'pt-BR'));
    const euLinha = linhas.find(l => l.n === eu) || { devido: 0, pago: 0, saldo: 0 };
    const terceiros = linhas.filter(l => l.n !== eu);
    const aReceber = terceiros.reduce((s, l) => s + Math.max(0, l.saldo), 0);

    const cobr = (cfg.cobr || []).map(c => { const dt = dataCobranca(cfg, c, mes); return { ...c, data: dt, status: hoje < dt ? 'a cobrar' : 'cobrado' }; });
    const faturas = cfg.meios.filter(m => m.t === 'cartao').map(m => {
      const calc = cartoes.get(m.n) || 0;
      const inf = fat[m.n] || {};
      const pend = cobr.filter(c => c.m === m.n && c.status === 'a cobrar').reduce((s, c) => s + c.v, 0);
      const informado = inf.i ?? null, pago = inf.p ?? 0;
      let dif = null;
      if (informado !== null) dif = Math.abs(informado - pago) < 0.005 && pago > 0 ? 0 : calc - informado - pend - pago;
      return { meio: m, calc, informado, pago, pend, dif };
    });
    const calcCartoes = faturas.reduce((s, f) => s + f.calc, 0);
    const faturasTotal = faturas.reduce((s, f) => s + (f.informado || 0) + f.pend, 0);
    const dinRecebido = (fat.Dinheiro && fat.Dinheiro.p) || 0;
    const totalLancado = calcCartoes + dinheiro;
    const sobra = euLinha.devido + aReceber - faturasTotal;
    return {
      mes, linhas, terceiros, eu: euLinha, aReceber, recebido, pagsMes, cobr, faturas,
      dinheiro: { calc: dinheiro, recebido: dinRecebido, falta: dinheiro - dinRecebido },
      totalLancado, calcCartoes, faturasTotal, sobra,
      sobraMaisRecebido: sobra + recebido,
      difFaturas: calcCartoes - faturasTotal,
      samuel: totalLancado - aReceber,
      cobrTotal: cobr.reduce((s, c) => s + (c.v || 0), 0),
    };
  }

  function saldoDevedor(idx, pags, nome, mes) {
    const devido = (idx.get(mes) || []).filter(i => i.c.d === nome).reduce((s, i) => s + i.v, 0);
    const pago = pags.filter(p => p.d === nome && p.f === mes).reduce((s, p) => s + p.v, 0);
    return { devido, pago, saldo: devido - pago };
  }

  /* ===== Planejamento ===== */
  function planejamento(cfg, mes, hoje = todayISO()) {
    const P = cfg.plan;
    const aj = P.ajuda;
    const ajuda = aj.tDias * aj.tDia + aj.aDias * aj.aDia;
    const cobrV = id => ((cfg.cobr || []).find(c => c.id === id) || {}).v || 0;
    const salario = P.emp.fat - P.emp.gastos;
    const base = it => {
      if (it.fx === 'dieta') return (P.dietaLimite || 0) - ajuda;
      if (it.fx === 'das') return P.emp.fat * (it.b || 0) / 100;
      if (it.lk) return cobrV(it.lk.c) / (it.lk.div || 1);
      return (it.b || 0) * (1 + (it.r || 0) / 100);
    };
    const fator = it => it.q[0] === 'c' ? 1 / (it.q[1] || 1) : (it.q[1] || 0);
    const itens = P.itens.map(it => ({ ...it, valor: base(it), fator: fator(it) }));
    // imprevistos = gastos da empresa − demais itens da empresa
    const empOutros = itens.filter(i => i.emp && i.fx !== 'imprevistos').reduce((s, i) => s + i.valor * i.fator, 0);
    for (const i of itens) if (i.fx === 'imprevistos') i.valor = P.emp.gastos - empOutros;
    for (const i of itens) { i.calc = i.valor * i.fator; i.mensal = i.mn != null ? i.mn : i.calc; }
    const pessoais = itens.filter(i => !i.emp);
    const custoVida = pessoais.reduce((s, i) => s + i.mensal, 0);
    const empresa = itens.filter(i => i.emp);

    const ap = apTabela(P.ap);
    const apMes = m => ap.linhas.find(l => l.mes === m) || { e: 0, d: 0, s: 0, total: 0 };
    const apSel = apMes(mes);
    const invest = P.invest.reduce((s, x) => s + (x.v || 0), 0);
    const outros = P.outros.reduce((s, x) => s + (x.v || 0), 0);

    const cx = new Map();
    const addCx = (n, v, tipo) => { const o = cx.get(n) || { n, v: 0, tipo }; o.v += v; cx.set(n, o); };
    for (const i of pessoais) addCx(i.cx || 'Sem caixinha', i.mensal, 'custo');
    addCx(P.ap.cxES, apSel.e + apSel.s, 'custo');
    addCx(P.ap.cxD, apSel.d, 'custo');
    for (const x of P.outros) addCx(x.n, x.v || 0, 'outros');
    for (const x of P.invest) addCx(x.n, x.v || 0, 'invest');
    const caixinhas = [...cx.values()];
    const totalCx = caixinhas.reduce((s, c) => s + c.v, 0);

    const receita = salario + ajuda + (P.extra || 0);
    const gastos = custoVida + invest + outros + apSel.total;

    const res = P.res;
    const acumulado = res.contas.reduce((s, c) => s + (c.v || 0), 0);
    const alvo = Math.ceil((res.meses * custoVida) / 1000) * 1000;
    const falta = alvo - acumulado;
    const mesesFaltam = falta <= 0 ? 0 : (res.aporte > 0 ? Math.ceil(falta / res.aporte) : null);

    /* Conferência de saldo — sempre sobre o mês corrente, não o selecionado.
       "A guardar" são as caixinhas que não saem da conta este mês; "saldoMin" é o
       que ainda vai debitar. As duas partes não se sobrepõem. */
    const diaHoje = Number(hoje.slice(8, 10));
    const mesHoje = hoje.slice(0, 7);
    const apHoje = apMes(mesHoje);
    const saldoItens = pessoais.filter(i => i.cx === P.ap.cxES);
    const saldoCx = saldoItens.reduce((s, i) => s + i.mensal, 0) + apHoje.e + apHoje.s;
    const totalCxHoje = totalCx - apSel.total + apHoje.total;
    const aGuardar = totalCxHoje - saldoCx;
    const pagos = saldoItens.filter(i => i.dia && i.dia <= diaHoje);
    const jaPagos = pagos.reduce((s, i) => s + i.mensal, 0);
    const apPago = diaHoje >= P.ap.dia;
    const saldoMin = saldoCx - jaPagos - (apPago ? apHoje.e + apHoje.s : 0);
    const contasPend = saldoItens.filter(i => !pagos.includes(i)).map(i => ({ n: i.n, dia: i.dia, v: i.mensal }));
    if (!apPago && apHoje.e + apHoje.s > 0) contasPend.push({ n: 'Entrada do AP + seguro obra', dia: P.ap.dia, v: apHoje.e + apHoje.s });
    contasPend.sort((a, b) => (a.dia || 99) - (b.dia || 99));
    const necessario = aGuardar + saldoMin;

    return { itens, pessoais, empresa, custoVida, ajuda, salario, receita, gastos, sobra: receita - gastos,
      invest, outros, apSel, ap, caixinhas, totalCx,
      reserva: { alvo, acumulado, falta, mesesFaltam },
      saldoMin, saldoCx, aGuardar, totalCxHoje, jaSaiu: totalCxHoje - necessario, contasPend, mesHoje,
      necessario, difSaldo: (P.saldoInf || 0) - necessario };
  }

  function apTabela(A) {
    const meses = Object.keys(A.meses).sort();
    if (!meses.length) return { linhas: [], taxaE: 0, taxaS: 0 };
    const var_ = (campo, desde) => {
      const xs = [];
      for (let i = 1; i < meses.length; i++) {
        const m = meses[i], p = meses[i - 1];
        if (m < desde || monthDiff(p, m) !== 1) continue;
        const a = A.meses[p][campo], b = A.meses[m][campo];
        if (a > 0 && b != null) xs.push((b - a) / a);
      }
      if (!xs.length) return 0;
      return A.metodo === 'media' ? xs.reduce((s, x) => s + x, 0) / xs.length : Math.max(...xs);
    };
    const taxaE = var_('e', A.desdeE || meses[0]);
    const taxaS = var_('s', A.desdeS || meses[0]);
    const linhas = [];
    let m = meses[0]; let prevE = 0, prevS = 0;
    const fim = A.ate > meses[meses.length - 1] ? A.ate : meses[meses.length - 1];
    while (m <= fim) {
      const a = A.meses[m] || {};
      const e = a.e != null ? a.e : prevE * (1 + taxaE);
      const s = a.s != null ? a.s : prevS * (1 + taxaS);
      const d = a.d != null ? a.d : 0;
      linhas.push({ mes: m, e, d, s, total: e + d + s, real: { e: a.e != null, d: a.d != null, s: a.s != null } });
      prevE = e; prevS = s; m = addMonths(m, 1);
    }
    return { linhas, taxaE, taxaS };
  }

  return { r2, pad, ym, addMonths, daysIn, dateIn, monthDiff, todayISO, meioDe, vencimento, gerarParcelas, indexar, resumo, saldoDevedor, dataCobranca, planejamento, apTabela };
})();

    <td class="n">${f.pend ? brl(f.pend) : '—'}</td>
    <td class="n" style="width:120px">${inp(`fat.${S.mes}.${f.meio.n}.p`, 'num', 'placeholder="0,00"')}</td>
    <td class="n ${difCls}" title="Calculado − informado − assinaturas a cobrar − pago">${f.dif == null ? '—' : brl(f.dif)}</td></tr>`;
  }).join('');

  // próximos 6 meses
  const prox = Array.from({ length: 6 }, (_, i) => {
    const m = Core.addMonths(S.mes, i);
    const r = Core.resumo(S.cfg, S.idx, S.pags, m);
    return { m, v: r.terceiros.reduce((s, l) => s + Math.max(0, l.saldo), 0), eu: r.eu.devido };
  });
  const mx = Math.max(1, ...prox.map(p => p.v + p.eu));
  const barras = prox.map((p, i) => {
    const x = i * 100 + 20, h1 = p.v / mx * 120, h2 = p.eu / mx * 120;
    return `<g><rect x="${x}" y="${150 - h1}" width="60" height="${h1}" fill="var(--owed)" rx="2"><title>A receber ${brl(p.v)}</title></rect>
      <rect x="${x}" y="${150 - h1 - h2}" width="60" height="${Math.max(0, h2 - 1)}" fill="var(--ink-3)" opacity=".45" rx="2"><title>Sua parte ${brl(p.eu)}</title></rect>
      <text x="${x + 30}" y="${145 - h1 - h2}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${Math.round(p.v).toLocaleString('pt-BR')}</text>
      <text x="${x + 30}" y="170" text-anchor="middle" font-size="12" fill="var(--ink-2)">${mesCurto(p.m)}</text></g>`;
  }).join('');

  let saldoMin = null;
  try { if (S.cfg.plan) saldoMin = Core.planejamento(S.cfg, S.mes).saldoMin; } catch (e) { }

  return `
  <div class="ledger-head">
    <div class="big"><div class="lbl">A receber em ${mesNome(S.mes)}</div><div class="val">${brl(R.aReceber)}</div><div class="hint">${R.terceiros.filter(l => l.saldo > 0.01).length} pessoas com saldo em aberto</div></div>
    <div><div class="lbl">Já recebido</div><div class="val paid">${brl(R.recebido)}</div><div class="hint">${R.pagsMes.length} pagamentos</div></div>
    <div><div class="lbl">Sua parte</div><div class="val">${brl(R.eu.devido)}</div><div class="hint">gastos de ${esc(S.cfg.eu)}</div></div>
    <div><div class="lbl">Total lançado</div><div class="val">${brl(R.totalLancado)}</div><div class="hint">cartões + dinheiro</div></div>
  </div>

  <section class="sec">
    <div class="sec-head"><h2>Quem deve em ${mesNome(S.mes)}</h2><p>Soma todas as parcelas do mês, qualquer dia de vencimento. Toque em um nome para ver o detalhe.</p><div class="spacer"></div>
      <label class="small"><input type="checkbox" data-act="so-aberto" ${S.soAberto ? 'checked' : ''}> Só em aberto</label></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Devedor</th><th class="n">Valor do mês</th><th class="n">Pago</th><th class="n">Falta</th><th class="n">Com ${numBR(taxa)}%</th>${dias.map(d => `<th class="n">Dia ${d}</th>`).join('')}<th>Situação</th></tr></thead>
      <tbody>${devRows || `<tr><td colspan="${6 + dias.length}" class="empty">Nenhuma parcela de terceiros neste mês.</td></tr>`}</tbody>
      <tfoot><tr><td>Total</td><td class="n">${brl(tot('devido'))}</td><td class="n">${brl(tot('pago'))}</td><td class="n">${brl(tot('saldo'))}</td><td class="n">${brl(tot('comTaxa'))}</td>${dias.map(d => `<td class="n">${brl(linhas.reduce((s, l) => s + (l.dias[d] || 0), 0))}</td>`).join('')}<td></td></tr>
      ${eu ? `<tr class="click" data-dev="${esc(eu.n)}"><td style="font-weight:600">${esc(eu.n)} (você)</td><td class="n" style="font-weight:600">${brl(eu.devido)}</td><td></td><td></td><td></td>${dias.map(d => `<td class="n" style="font-weight:500">${eu.dias[d] ? brl(eu.dias[d]) : '—'}</td>`).join('')}<td></td></tr>` : ''}</tfoot>
    </table></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Conferência das faturas</h2><p>Digite o valor que aparece no app do banco. A diferença considera as assinaturas que ainda vão cair.</p></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Cartão</th><th class="n">Calculado</th><th class="n">Informado</th><th class="n">Assinaturas a cobrar</th><th class="n">Pago</th><th class="n">Diferença</th></tr></thead>
      <tbody>${fatRows}
      <tr><td><span class="dot" style="background:${meioCor('Dinheiro')}"></span><b>Dinheiro</b> <span class="muted small">emprestado</span></td><td class="n">${brl(R.dinheiro.calc)}</td><td class="n muted">—</td><td class="n muted">—</td>
      <td class="n">${inp(`fat.${S.mes}.Dinheiro.p`, 'num', 'placeholder="recebido"')}</td><td class="n ${cls(R.dinheiro.falta)}" title="Esperado − recebido">${brl(R.dinheiro.falta)}</td></tr></tbody>
    </table></div>
  </section>

  <div class="grid2">
    <section class="sec">
      <div class="sec-head"><h2>Balanço do mês</h2></div>
      <div class="card"><dl class="kv">
        <dt>Faturas a pagar<small>informadas + assinaturas a cobrar</small></dt><dd>${brl(R.faturasTotal)}</dd>
        <dt>Sua parte + a receber</dt><dd>${brl(R.eu.devido + R.aReceber)}</dd>
        <dt>Sobra<small>(sua parte + a receber) − faturas</small></dt><dd class="${R.sobra < 0 ? 'owed' : ''}">${brl(R.sobra)}</dd>
        <dt>Sobra + recebido</dt><dd>${brl(R.sobraMaisRecebido)}</dd>
        <dt>Calculado − faturas<small>cartões lançados vs. faturas</small></dt><dd>${brl(R.difFaturas)}</dd>
        <dt>Diferença + dinheiro emprestado</dt><dd>${brl(R.difFaturas + R.dinheiro.calc)}</dd>
        <dt class="tot">Seu custo (total − a receber)</dt><dd class="tot">${brl(R.samuel)}</dd>
      </dl>
      ${saldoMin != null ? `<p class="small muted" style="margin:12px 0 0">Saldo mínimo esperado em conta hoje: <b style="color:var(--ink)">${brl(saldoMin)}</b></p>` : ''}</div>
    </section>
    <section class="sec">
      <div class="sec-head"><h2>Próximos 6 meses</h2><p>A receber (laranja) e sua parte (cinza)</p></div>
      <div class="card"><svg viewBox="0 0 620 180" width="100%" role="img" aria-label="A receber nos próximos meses">${barras}</svg></div>
    </section>
  </div>

  <section class="sec">
    <div class="sec-head"><h2>Cobranças mensais</h2><p>Assinaturas que caem nos cartões. A data é calculada pelo fechamento de cada cartão.</p><div class="spacer"></div><button class="btn small" data-view="ajustes">Editar lista</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Cobrança</th><th>Quem paga</th><th>Cartão</th><th class="n">Valor</th><th>Data da cobrança</th><th>Situação</th></tr></thead>
      <tbody>${R.cobr.map(c => `<tr><td>${esc(c.n)}</td><td class="wrap small">${quemPaga(c)}</td><td><span class="dot" style="background:${meioCor(c.m)}"></span>${esc(c.m)}</td><td class="n">${brl(c.v)}</td><td>${dataBR(c.data)}</td><td><span class="chip ${c.status === 'a cobrar' ? 'warn' : ''}">${cap(c.status)}</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nenhuma cobrança cadastrada.</td></tr>'}</tbody>
      <tfoot><tr><td>Total</td><td></td><td></td><td class="n">${brl(R.cobrTotal)}</td><td></td><td></td></tr></tfoot>
    </table></div>
  </section>`;
}

function quemPaga(c) {
  if (!c.rateio || !c.rateio.length) return '<span class="chip warn">sem rateio</span>';
  const vs = [...new Set(c.rateio.map(r => r.v))];
  return esc(c.rateio.map(r => r.d).join(', ')) + (vs.length === 1 && c.rateio.length > 1 ? ` <span class="muted">· ${brl(vs[0])} cada</span>` : '');
}

/* ===== Devedores ===== */
function vDevedores() {
  const nomes = devsAtivos();
  const lista = nomes.map(n => { const s = Core.saldoDevedor(S.idx, S.pags, n, S.mes); return { n, ...s }; })
    .sort((a, b) => (a.n === S.cfg.eu) - (b.n === S.cfg.eu) || b.saldo - a.saldo || a.n.localeCompare(b.n));
  if (!S.devSel || !devsTodos().includes(S.devSel)) S.devSel = (lista[0] || {}).n;
  const listHtml = lista.map(d => `<button data-dev="${esc(d.n)}" ${d.n === S.devSel ? 'aria-current="true"' : ''}><span>${esc(d.n)}${d.n === S.cfg.eu ? ' <span class="muted small">(você)</span>' : ''}</span><span class="${cls(d.saldo)}">${Math.abs(d.saldo) < .005 ? '—' : brl(d.saldo)}</span></button>`).join('');
  const n = S.devSel;
  if (!n) return `<div class="empty">Cadastre um devedor em Ajustes.</div>`;
  const modo = S.devModo;
  const todas = S.compras.filter(c => c.d === n).flatMap(c => c.p.map(p => ({ c, k: p[0], v: p[1], venc: p[2] })));
  let parc = modo === 'mes' ? todas.filter(i => i.venc.slice(0, 7) === S.mes) : modo === 'aberto' ? todas.filter(i => i.venc.slice(0, 7) >= S.mes) : todas;
  // dentro de cada mês de fatura, sempre em ordem de data da compra
  parc.sort((a, b) => a.venc.slice(0, 7).localeCompare(b.venc.slice(0, 7)) || a.c.dt.localeCompare(b.c.dt) || a.c.c.localeCompare(b.c.c, 'pt-BR'));
  let pg = S.pags.filter(p => p.d === n);
  pg = modo === 'mes' ? pg.filter(p => p.f === S.mes) : modo === 'aberto' ? pg.filter(p => p.f >= S.mes) : pg;
  pg.sort((a, b) => b.dt.localeCompare(a.dt));
  const soma = a => a.reduce((s, i) => s + i.v, 0);
  const devido = soma(parc), pago = soma(pg), falta = devido - pago;
  const uma = soma(parc.filter(i => i.c.n === 1)), mais = soma(parc.filter(i => i.c.n > 1));
  const uber = soma(parc.filter(i => /uber/i.test(i.c.c)));
  const st = Math.abs(falta) <= 0.01 ? 'quitado' : falta < 0 ? 'credito' : pago > 0 ? 'parcial' : 'aberto';
  const taxa = S.cfg.taxa || 0;
  const strip = Array.from({ length: 6 }, (_, i) => { const m = Core.addMonths(S.mes, i); return { m, ...Core.saldoDevedor(S.idx, S.pags, n, m) }; });
  const mx = Math.max(1, ...strip.map(s => s.devido));
  const periodo = modo === 'mes' ? `em ${mesNome(S.mes)}` : modo === 'aberto' ? `de ${mesCurto(S.mes)} em diante` : 'no histórico';
  const mesesAgrupados = modo !== 'mes';

  let rows = ''; let lastM = '';
  for (const i of parc) {
    const m = i.venc.slice(0, 7);
    if (mesesAgrupados && m !== lastM) { rows += `<tr><td colspan="6" style="background:var(--sheet-2);font-weight:700">${cap(mesNome(m))} ${m.slice(0, 4)} <span class="muted small">· ${brl(parc.filter(x => x.venc.slice(0, 7) === m).reduce((s, x) => s + x.v, 0))}</span></td></tr>`; lastM = m; }
    rows += `<tr class="click" data-compra="${i.c.i}"><td class="wrap">${esc(i.c.c)}</td><td>${dataBR(i.c.dt)}</td><td><span class="dot" style="background:${meioCor(i.c.m)}"></span>${esc(i.c.m)}</td><td class="n">${i.k}/${i.c.n}</td><td class="n">${brl(i.v)}</td><td>${dataBR(i.venc)}</td></tr>`;
  }
  return `<div class="dev-layout">
    <nav class="dev-list" aria-label="Devedores">${listHtml}</nav>
    <div>
      <div class="dev-title"><h2>${esc(n)}</h2>${n !== S.cfg.eu ? stamp(st, true) : ''}<div style="flex:1"></div>
        <div class="seg" role="group" aria-label="Período">${[['mes', 'Este mês'], ['aberto', 'Daqui pra frente'], ['tudo', 'Tudo']].map(([k, t]) => `<button data-act="devmodo" data-v="${k}" aria-pressed="${modo === k}">${t}</button>`).join('')}</div></div>
      <div class="ledger-head">
        <div class="big"><div class="lbl">Falta ${periodo}</div><div class="val ${cls(falta)}" style="${falta <= 0.005 ? 'color:var(--paid)' : ''}">${brl(falta)}</div><div class="hint">com ${numBR(taxa)}%: ${brl(devido * (1 + taxa / 100) - pago)}</div></div>
        <div><div class="lbl">Parcelas</div><div class="val">${brl(devido)}</div><div class="hint">${parc.length} lançamentos</div></div>
        <div><div class="lbl">Pago</div><div class="val paid">${brl(pago)}</div><div class="hint">${pg.length} pagamentos</div></div>
        <div><div class="lbl">À vista / parcelado</div><div class="val" style="font-size:15px;line-height:1.35">${brl(uma)}<br><span class="muted">${brl(mais)}</span></div><div class="hint">${uber ? 'Uber: ' + brl(uber) : 'sem Uber'}</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:-12px 0 22px">
        <button class="btn primary" data-act="cobrar">${ico('copy', 'Copiar cobrança')}</button>
        <button class="btn" data-act="novo-pag" data-d="${esc(n)}" data-v="${falta > 0 ? Core.r2(falta) : ''}">${ico('plus', 'Registrar pagamento')}</button>
        <button class="btn" data-act="nova-compra" data-d="${esc(n)}">${ico('plus', 'Nova compra')}</button>
      </div>
      <section class="sec"><div class="sec-head"><h3>Próximos meses</h3></div>
        <div class="months-strip">${strip.map(s => `<button data-act="ir-mes" data-m="${s.m}" class="${s.m === S.mes ? 'cur' : ''}"><div class="m">${mesCurto(s.m)}</div><div class="v ${cls(s.saldo)}">${brl(s.saldo)}</div><div class="bar"><i style="width:${s.devido / mx * 100}%"></i></div></button>`).join('')}</div>
      </section>
      <section class="sec"><div class="sec-head"><h3>Parcelas ${periodo}</h3><p>Toque em uma linha para editar a compra.</p></div>
        <div class="tbl-wrap"><table><thead><tr><th>Compra</th><th>Data</th><th>Meio</th><th class="n">Parcela</th><th class="n">Valor</th><th>Vencimento</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">Nenhuma parcela neste período.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="4">Total</td><td class="n">${brl(devido)}</td><td></td></tr></tfoot></table></div></section>
      <section class="sec"><div class="sec-head"><h3>Pagamentos ${periodo}</h3></div>
        <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Meio</th><th>Fatura</th><th class="n">Valor</th><th></th></tr></thead>
        <tbody>${pg.map(p => `<tr><td>${dataBR(p.dt)}</td><td>${esc(p.m)}</td><td>${mesCurto(p.f)}</td><td class="n paid">${brl(p.v)}</td><td><div class="row-actions"><button class="btn link" data-act="edit-pag" data-id="${p.i}" aria-label="Editar">${ico('edit')}</button></div></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nenhum pagamento neste período.</td></tr>'}</tbody>
        <tfoot><tr><td colspan="3">Total</td><td class="n">${brl(pago)}</td><td></td></tr></tfoot></table></div></section>
    </div></div>`;
}
function textoCobranca() {
  const n = S.devSel; const m = S.mes;
  const parc = (S.idx.get(m) || []).filter(i => i.c.d === n).sort((a, b) => a.venc.localeCompare(b.venc));
  const pago = S.pags.filter(p => p.d === n && p.f === m).reduce((s, p) => s + p.v, 0);
  const tot = parc.reduce((s, i) => s + i.v, 0);
  const linhas = parc.map(i => `• ${i.c.c}${i.c.n > 1 ? ` (${i.k}/${i.c.n})` : ''} — ${brl(i.v)}`).join('\n');
  const venc = parc.length ? dataBR(parc[parc.length - 1].venc) : '';
  return `Oi, ${n}! Segue o resumo de ${mesNome(m)}/${m.slice(0, 4)}:\n\n${linhas || '(nenhuma parcela)'}\n\nTotal: ${brl(tot)}` +
    (pago ? `\nJá pago: ${brl(pago)}\nFalta: ${brl(tot - pago)}` : '') + (venc ? `\nVencimento: ${venc}` : '');
}

/* ===== Lançamentos ===== */
function vLancamentos() {
  const f = S.lf; const q = f.q.trim().toLowerCase();
  let cs = S.compras.filter(c => (!f.d || c.d === f.d) && (!f.m || c.m === f.m) && (!q || c.c.toLowerCase().includes(q)));
  // cobranças mensais: só as do mês selecionado, a menos que esteja buscando por nome
  const nRecOcultas = q ? 0 : cs.filter(c => c.rec && Recorr.mesDe(c) !== S.mes).length;
  if (!q) cs = cs.filter(c => !c.rec || Recorr.mesDe(c) === S.mes);
  const ultimo = c => c.p.length ? c.p[c.p.length - 1][2].slice(0, 7) : '';
  if (f.st === 'aberto') cs = cs.filter(c => ultimo(c) >= S.mes);
  if (f.st === 'mes') cs = cs.filter(c => c.p.some(p => p[2].slice(0, 7) === S.mes));
  if (f.st === 'quitado') cs = cs.filter(c => ultimo(c) < S.mes);
  cs.sort((a, b) => b.dt.localeCompare(a.dt) || a.d.localeCompare(b.d));
  const total = cs.reduce((s, c) => s + c.p.filter(p => p[2].slice(0, 7) >= S.mes).reduce((x, p) => x + p[1], 0), 0);
  const itens = cs.slice(0, f.lim).map(c => {
    const rest = c.p.filter(p => p[2].slice(0, 7) >= S.mes);
    const prox = rest[0];
    const ks = c.p.map(p => p[0]);
    const faixa = ks.length ? (Math.min(...ks) === Math.max(...ks) ? `${ks[0]}` : `${Math.min(...ks)}–${Math.max(...ks)}`) : '';
    const pagas = prox ? prox[0] - 1 : c.n;
    return `<div class="item click" data-compra="${c.i}" role="button" tabindex="0">
      <div style="min-width:0"><div class="t">${esc(c.c) || '<span class="muted">(sem descrição)</span>'}${c.rec ? ' <span class="chip">mensal</span>' : ''}</div>
      <div class="meta"><b style="color:var(--ink-2)">${esc(c.d)}</b> · <span class="dot" style="background:${meioCor(c.m)}"></span>${esc(c.m)} · ${dataBR(c.dt)} · parcelas ${faixa} de ${c.n}</div></div>
      <div class="amt">${brl(c.v)}<div class="meta">${prox ? `próx. ${dataBR(prox[2])} · ${brl(prox[1])}` : 'quitada'}</div></div>
      <div class="prog"><i style="width:${c.n ? pagas / c.n * 100 : 100}%"></i></div></div>`;
  }).join('');
  const opt = (arr, sel, todos) => `<option value="">${todos}</option>` + arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
  return `<section class="sec">
    <div class="sec-head"><h2>Lançamentos</h2><p>Cada compra aparece uma vez; as parcelas são geradas automaticamente.</p><div class="spacer"></div><button class="btn small" data-act="colar">${ico('copy', 'Colar lançamentos')}</button></div>
    <div class="filters">
      <input type="search" placeholder="Buscar compra" data-lf="q" data-focus="lf-q" value="${esc(f.q)}" style="flex:1;min-width:160px">
      <select data-lf="d" aria-label="Devedor">${opt(devsTodos(), f.d, 'Todos os devedores')}</select>
      <select data-lf="m" aria-label="Meio">${opt(S.cfg.meios.map(m => m.n), f.m, 'Todos os meios')}</select>
      <div class="seg">${[['aberto', 'Em aberto'], ['mes', 'Neste mês'], ['quitado', 'Quitadas'], ['todas', 'Todas']].map(([k, t]) => `<button data-act="lf-st" data-v="${k}" aria-pressed="${f.st === k}">${t}</button>`).join('')}</div>
    </div>
    <p class="small muted" style="margin:0 0 8px">${cs.length} compras · a pagar de ${mesCurto(S.mes)} em diante: <b style="color:var(--ink)">${brl(total)}</b>${nRecOcultas ? ` · cobranças mensais de outros meses ocultas (busque pelo nome para ver)` : ''}</p>
    <div class="tbl-wrap lanc-list">${itens || '<div class="empty">Nenhuma compra encontrada.</div>'}</div>
    ${cs.length > f.lim ? `<p style="text-align:center"><button class="btn" data-act="lf-mais">Mostrar mais (${cs.length - f.lim})</button></p>` : ''}
  </section>`;
}

/* ===== Pagamentos ===== */
function vPagamentos() {
  const f = S.pf;
  let ps = S.pags.filter(p => (!f.d || p.d === f.d) && (f.per === 'todos' || p.f === S.mes));
  ps.sort((a, b) => b.dt.localeCompare(a.dt));
  const tot = ps.reduce((s, p) => s + p.v, 0);
  const opt = devsTodos().map(x => `<option ${x === f.d ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const porDev = {};
  ps.forEach(p => porDev[p.d] = (porDev[p.d] || 0) + p.v);
  return `<section class="sec">
    <div class="sec-head"><h2>Pagamentos recebidos</h2><p>Cada pagamento abate a fatura do mês indicado.</p></div>
    <div class="filters">
      <select data-pf="d" aria-label="Devedor"><option value="">Todos os devedores</option>${opt}</select>
      <div class="seg">${[['mes', `Fatura de ${mesCurto(S.mes)}`], ['todos', 'Todos']].map(([k, t]) => `<button data-act="pf-per" data-v="${k}" aria-pressed="${f.per === k}">${t}</button>`).join('')}</div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Devedor</th><th>Meio</th><th>Fatura</th><th class="n">Valor</th><th></th></tr></thead>
    <tbody>${ps.map(p => {
      const longe = pagLonge(p);

/* ===== Ajustes ===== */
function problemas() {
  const out = [];
  const ver = (t, lista, titulo) => out.push({ t, lista, titulo });
  const nomes = new Set(devsTodos()); const meios = new Set(S.cfg.meios.map(m => m.n));
  const semDev = S.compras.filter(c => !nomes.has(c.d)); if (semDev.length) ver(`${semDev.length} compras com devedor fora da lista: ${[...new Set(semDev.map(c => c.d))].join(', ')}.`, semDev, 'Compras com devedor fora da lista');
  const semMeio = S.compras.filter(c => !meios.has(c.m)); if (semMeio.length) ver(`${semMeio.length} compras com meio de pagamento fora da lista.`, semMeio, 'Compras com meio fora da lista');
  const zero = S.compras.filter(c => !c.v); if (zero.length) ver(`${zero.length} compra(s) com valor zero.`, zero, 'Compras com valor zero');
  const longe = S.pags.filter(pagLonge); if (longe.length) out.push({ t: `${longe.length} pagamentos com data distante do mês da fatura.`, view: 'pagamentos' });
  const R = Core.resumo(S.cfg, S.idx, S.pags, S.mes);
  R.faturas.filter(f => f.dif != null && Math.abs(f.dif) > 1).forEach(f => out.push({ t: `Fatura ${f.meio.n} de ${mesCurto(S.mes)} difere em ${brl(f.dif)} do calculado.`, view: 'resumo' }));
  const semRat = (S.cfg.cobr || []).filter(c => !c.rateio || !c.rateio.length); if (semRat.length) out.push({ t: `${semRat.length} cobrança(s) mensal(is) sem rateio não geram lançamentos: ${semRat.map(c => c.n).join(', ')}.` });
  const nomesRat = new Set((S.cfg.cobr || []).flatMap(c => (c.rateio || []).map(r => r.d)).filter(n => !nomes.has(n))); if (nomesRat.size) out.push({ t: `Rateio com devedor fora da lista: ${[...nomesRat].join(', ')}.` });
  if (Limpeza.cfg().ativo && Store.mode !== 'drive') out.push({ t: 'A limpeza automática só roda conectado ao Google Drive, para salvar a cópia antes de apagar.' });
  const inativos = S.cfg.devs.filter(d => !d.a).map(d => d.n).filter(n => (S.idx.get(S.mes) || []).some(i => i.c.d === n)); if (inativos.length) out.push({ t: `Devedores inativos com parcelas neste mês: ${inativos.join(', ')}.` });
  return out;
}

function dlgRateio(i) {

  d.innerHTML = `<form method="dialog" id="f-rat">

    <div class="dlg-body">
      <p class="full small muted" style="margin:0">Marque quem paga e quanto. Cada pessoa marcada ganha um lançamento de ${esc(cob.m)} todo mês. Inclua você (${esc(S.cfg.eu)}) se tiver uma parte.</p>
      <div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px">

      </div>
      <p class="full" style="margin:0" id="rat-soma"></p>
    </div>
    <div class="dlg-foot"><button class="btn" type="button" id="rat-igual">Dividir igualmente</button><div class="spacer"></div>
      <button class="btn" value="x" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Salvar rateio</button></div></form>`;
  const f = $('#f-rat');
  const ler = () => [...f.querySelectorAll('input[name=p]:checked')].map(x => ({ d: x.value, v: parseNum(f.elements['v-' + x.value].value) }));
  const soma = () => { const r = ler(); const s = r.reduce((a, x) => a + (isFinite(x.v) ? x.v : 0), 0); $('#rat-soma').innerHTML = `Soma: <b>${brl(s)}</b> de ${brl(cob.v)}${Math.abs(cob.v - s) > 0.05 ? ` <span class="chip warn">faltam ${brl(cob.v - s)}</span>` : ''}`; };
  f.addEventListener('input', soma); f.addEventListener('change', soma); soma();
  $('#rat-igual').onclick = () => {
    const marc = [...f.querySelectorAll('input[name=p]:checked')]; if (!marc.length) { toast('Marque pelo menos uma pessoa'); return; }
    const v = Math.round(cob.v / marc.length * 100) / 100;
    marc.forEach(x => { f.elements['v-' + x.value].value = numBR(v); }); soma();
  };
  f.addEventListener('submit', e => {

    const r = ler();
    if (r.some(x => !isFinite(x.v) || x.v <= 0)) { e.preventDefault(); toast('Informe o valor de cada pessoa marcada'); return; }
    cob.rateio = r;
    Recorr.regenerar(cob.id); reindex(); Store.mark(); render(); toast('Rateio salvo');
  });
  d.showModal();
}

/* ===== Colar lançamentos ===== */
function acharNome(lista, v) {
  const s = String(v ?? '').trim().toLowerCase();
  if (!s) return null;
  return lista.find(x => x.toLowerCase() === s) || lista.find(x => x.toLowerCase().replace(/[^a-z]/g, '') === s.replace(/[^a-z]/g, '')) || null;
}
function dataDoTexto(v) {
  if (v == null || v === '') return Core.todayISO();
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${Core.pad(+m[2])}-${Core.pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?$/);
  if (m) { const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : Core.todayISO().slice(0, 4); return `${y}-${Core.pad(+m[2])}-${Core.pad(+m[1])}`; }
  return null;
}
function parseLote(txt) {
  let s = String(txt || '').trim().replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '').trim();
  if (!s) return { erro: 'Cole o bloco que o Claude gerou.' };
  let j; try { j = JSON.parse(s); } catch (e) { return { erro: 'Não consegui ler o texto. Ele precisa ser o bloco em JSON gerado pelo Claude.' }; }
  if (Array.isArray(j)) j = { compras: j };
  if (!j || typeof j !== 'object') return { erro: 'Formato não reconhecido.' };
  const nomes = devsTodos(), meios = S.cfg.meios.map(m => m.n);
  const padraoMeio = acharNome(meios, 'Inter') || (S.cfg.meios.find(m => m.t === 'cartao') || S.cfg.meios[0] || {}).n;
  const compras = [], pags = [];
  for (const o of (j.compras || j.lancamentos || [])) {
    const brutos = Array.isArray(o.d ?? o.devedor) ? (o.d ?? o.devedor) : [o.d ?? o.devedor];
    const devs = brutos.map(x => acharNome(nomes, x));
    const descr = String(o.c ?? o.compra ?? o.descricao ?? '').trim();
    const meioBruto = o.m ?? o.meio ?? o.cartao;
    const meio = meioBruto ? acharNome(meios, meioBruto) : padraoMeio;
    const dt = dataDoTexto(o.dt ?? o.data);
    const v = parseNum(o.v ?? o.valor);
    const n = Math.max(1, parseInt(o.n ?? o.parcelas ?? 1) || 1);
    const erros = [];
    if (!descr) erros.push('falta a descrição');
    brutos.forEach((x, i) => { if (!devs[i]) erros.push(`devedor “${x ?? ''}” não existe`); });
    if (!meio) erros.push(`meio “${meioBruto}” não existe`);
    if (!dt) erros.push('data inválida');
    if (!isFinite(v) || !v) erros.push('valor inválido');
    compras.push({ devs, descr, meio, dt, v, n, erros, prim: o.primeira ?? o.venc ?? null });
  }
  for (const o of (j.pags || j.pagamentos || [])) {
    const dev = acharNome(nomes, o.d ?? o.devedor);
    const dt = dataDoTexto(o.dt ?? o.data);
    const v = parseNum(o.v ?? o.valor);
    let f = String(o.f ?? o.fatura ?? '').trim();
    if (/^\d{4}-\d{1,2}$/.test(f)) f = f.slice(0, 4) + '-' + Core.pad(+f.slice(5));
    else f = dt ? dt.slice(0, 7) : '';
    const meio = String(o.m ?? o.meio ?? 'Pix').trim() || 'Pix';
    const erros = [];
    if (!dev) erros.push(`devedor “${o.d ?? o.devedor ?? ''}” não existe`);
    if (!dt) erros.push('data inválida');
    if (!isFinite(v) || !v) erros.push('valor inválido');
    pags.push({ dev, dt, v, f, meio, erros });
  }
  if (!compras.length && !pags.length) return { erro: 'O bloco não trouxe nenhuma compra nem pagamento.' };
  return { compras, pags };
}
function dlgColar() {
  const d = $('#dlg'); d.className = 'wide';
  d.innerHTML = `<form method="dialog" id="f-colar">
    <div class="dlg-head"><h2>Colar lançamentos</h2><button class="icon-btn" value="x" formnovalidate aria-label="Fechar">✕</button></div>
    <div class="dlg-body">
      <p class="full small muted" style="margin:0">Peça as compras ao Claude, copie o bloco que ele devolver e cole aqui. A prévia mostra o que será lançado.</p>
      <textarea class="full" id="lote" rows="7" placeholder='{"app":"caderneta-lote","compras":[{"d":"Lidia","m":"Inter","c":"Farmácia","dt":"22/09/2026","v":150,"n":3}]}' style="width:100%;border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--sheet-2);font-family:ui-monospace,monospace;font-size:13px"></textarea>
      <div class="full" id="lote-prev"></div>
    </div>
    <div class="dlg-foot"><button class="btn" type="button" id="lote-colar">Colar da área de transferência</button><div class="spacer"></div>
      <button class="btn" value="x" formnovalidate>Cancelar</button><button class="btn primary" value="ok" id="lote-ok" disabled>Lançar</button></div></form>`;
  const f = $('#f-colar'); let lote = null;
  const prev = () => {
    lote = parseLote($('#lote').value);
    const el = $('#lote-prev'); const ok = $('#lote-ok');
    if (lote.erro) { el.innerHTML = $('#lote').value.trim() ? `<div class="notice">${esc(lote.erro)}</div>` : ''; ok.disabled = true; return; }
    const bons = lote.compras.filter(c => !c.erros.length), bonsP = lote.pags.filter(p => !p.erros.length);
    const linhas = lote.compras.map(c => {
      const venc = !c.erros.length ? Core.gerarParcelas(S.cfg, { meio: c.meio, data: c.dt, total: c.v, n: c.n, primeira: c.prim })[0][2] : null;
      return `<tr class="${c.erros.length ? 'dim' : ''}"><td class="wrap">${esc(c.descr) || '—'}</td><td>${esc(c.devs.filter(Boolean).join(' + ')) || '—'}</td><td>${esc(c.meio || '—')}</td><td>${c.dt ? dataBR(c.dt) : '—'}</td><td class="n">${isFinite(c.v) ? brl(c.v) : '—'}</td><td class="n">${c.n}x</td>
      <td class="small">${c.erros.length ? `<span class="owed">${esc(c.erros.join('; '))}</span>` : `1ª em ${dataBR(venc)}${c.devs.length > 1 ? ` · ${brl(c.v / c.devs.length)} cada` : ''}`}</td></tr>`;
    }).join('');
    const linhasP = lote.pags.map(p => `<tr class="${p.erros.length ? 'dim' : ''}"><td class="wrap">Pagamento</td><td>${esc(p.dev || '—')}</td><td>${esc(p.meio)}</td><td>${p.dt ? dataBR(p.dt) : '—'}</td><td class="n">${isFinite(p.v) ? brl(p.v) : '—'}</td><td class="n">fatura ${p.f ? mesCurto(p.f) : '—'}</td><td class="small">${p.erros.length ? `<span class="owed">${esc(p.erros.join('; '))}</span>` : 'abate a fatura'}</td></tr>`).join('');
    el.innerHTML = `<div class="tbl-wrap" style="max-height:240px;overflow:auto"><table><thead><tr><th>Descrição</th><th>Devedor</th><th>Meio</th><th>Data</th><th class="n">Valor</th><th class="n">Parc.</th><th>Situação</th></tr></thead><tbody>${linhas}${linhasP}</tbody></table></div>
      <p class="small muted" style="margin:8px 0 0">${bons.length} compra(s) e ${bonsP.length} pagamento(s) prontos${lote.compras.length - bons.length + lote.pags.length - bonsP.length ? ` · ${lote.compras.length - bons.length + lote.pags.length - bonsP.length} com problema serão ignorados` : ''}.</p>`;
    ok.disabled = !bons.length && !bonsP.length;
  };
  f.addEventListener('input', prev);
  $('#lote-colar').onclick = async () => {
    try { $('#lote').value = await navigator.clipboard.readText(); prev(); }
    catch (e) { toast('Cole com Ctrl+V na caixa'); $('#lote').focus(); }
  };
  f.addEventListener('submit', e => {
    if (e.submitter && e.submitter.value !== 'ok') return;
    if (!lote || lote.erro) { e.preventDefault(); return; }
    let nc = 0, np = 0;
    for (const c of lote.compras.filter(x => !x.erros.length)) {
      const cada = c.v / c.devs.length;
      for (const dev of c.devs) {
        S.compras.push({ i: uid('c'), d: dev, m: c.meio, c: c.descr, dt: c.dt, v: cada, n: c.n,
          p: Core.gerarParcelas(S.cfg, { meio: c.meio, data: c.dt, total: cada, n: c.n, primeira: c.prim }) });
        nc++;
      }
    }
    for (const p of lote.pags.filter(x => !x.erros.length)) { S.pags.push({ i: uid('p'), d: p.dev, m: p.meio, dt: p.dt, v: p.v, f: p.f }); np++; }
    reindex(); Store.mark(); render();
    toast(`${nc} lançamento(s)${np ? ` e ${np} pagamento(s)` : ''} adicionados`);
  });
  d.showModal(); setTimeout(() => $('#lote').focus(), 30);
}

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.bind) {
    const ty = t.dataset.type; let v;
    if (ty === 'bool') v = t.checked;
    else if (ty === 'text') v = t.value;
    else if (ty === 'int') { v = parseInt(t.value); if (!isFinite(v)) v = 0; }
    else if (ty === 'intnull') { v = parseInt(t.value); if (!isFinite(v)) v = null; }
    else if (ty === 'numnull') { v = parseNum(t.value); if (!isFinite(v)) v = null; }
    else { v = parseNum(t.value); if (!isFinite(v)) v = 0; }
    setPath(S.cfg, t.dataset.bind, v);
    if (t.dataset.bind.startsWith('cobr.')) {
      const cob = S.cfg.cobr[+t.dataset.bind.split('.')[1]];
      if (cob && Recorr.regenerar(cob.id)) reindex();
    }
    if (t.dataset.bind === 'recorr.desde' || t.dataset.bind === 'recorr.meses') { if (Recorr.gerar()) reindex(); }
    if (t.dataset.bind.startsWith('fat.')) {
      // limpa entradas vazias
      const m = t.dataset.bind.split('.');
      const o = S.cfg.fat[m[1]][m[2]]; if (o && o.i == null && !o.p) delete S.cfg.fat[m[1]][m[2]];
    }
    Store.mark('cfg'); render(); return;
  }
  if (t.dataset.ap) {
    const [m, c] = t.dataset.ap.split('.'); const v = parseNum(t.value);
    const row = S.cfg.plan.ap.meses[m] || (S.cfg.plan.ap.meses[m] = {});
    if (isFinite(v)) row[c] = v; else delete row[c];
    if (!Object.keys(row).length) delete S.cfg.plan.ap.meses[m];
    Store.mark('cfg'); render(); return;
  }
  if (t.dataset.renameDev != null) {
    const old = t.dataset.renameDev, n = t.value.trim();
    if (!n || n === old) { t.value = old; return; }
    if (devsTodos().some(x => x !== old && x.toLowerCase() === n.toLowerCase())) {
      if (!await confirmar(`Já existe “${n}”. Juntar todos os lançamentos de ${old} em ${n}?`, 'Juntar')) { t.value = old; return; }
      S.cfg.devs = S.cfg.devs.filter(d => d.n !== old);
    } else S.cfg.devs.find(d => d.n === old).n = n;
    const meses = new Set();
    S.compras.forEach(c => { if (c.d === old) { c.d = n; meses.add('c-' + c.dt.slice(0, 7)); } });
    S.pags.forEach(p => { if (p.d === old) p.d = n; });
    if (S.cfg.eu === old) S.cfg.eu = n; if (S.devSel === old) S.devSel = n;
    Recorr.renomear(old, n);
    Store.mark('cfg', 'pag', ...meses); reindex(); render(); toast('Nome atualizado'); return;
  }
  if (t.dataset.renameMeio != null) {
    const old = t.dataset.renameMeio, n = t.value.trim();
    if (!n || n === old || S.cfg.meios.some(m => m.n === n)) { t.value = old; if (n && n !== old) toast('Esse nome já existe'); return; }
    S.cfg.meios.find(m => m.n === old).n = n;
    const meses = new Set();
    S.compras.forEach(c => { if (c.m === old) { c.m = n; meses.add('c-' + c.dt.slice(0, 7)); } });
    (S.cfg.cobr || []).forEach(c => { if (c.m === old) c.m = n; });
    Object.values(S.cfg.fat || {}).forEach(o => { if (o[old]) { o[n] = o[old]; delete o[old]; } });
    Store.mark('cfg', ...meses); reindex(); render(); return;
  }
  if (t.id === 'imp-json' && S.ready) {
    const file = t.files[0]; if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (j.app === 'caderneta-arquivo') {
        if (!await confirmar(`Trazer de volta os registros arquivados até ${mesNome(j.corte)}/${String(j.corte).slice(0, 4)} (${(j.compras || []).length} compras, ${(j.pags || []).length} pagamentos)? Eles serão removidos de novo na próxima limpeza, a menos que você desative a limpeza automática.`, 'Restaurar')) { t.value = ''; return; }
        const r = restaurarArquivo(j);
        reindex(); Store.mark(); render(); toast(`${r.nc} parcelas e ${r.np} pagamentos restaurados`); t.value = ''; return;
      }
      if (j.app !== 'caderneta' || !j.cfg || !Array.isArray(j.compras)) throw new Error('formato');
      if (!await confirmar(`Substituir todos os dados atuais por este backup (${j.compras.length} compras, ${(j.pags || []).length} pagamentos)?`, 'Substituir')) return;
      const antigos = new Set(S.compras.map(c => 'c-' + c.dt.slice(0, 7)));
      S.cfg = j.cfg; S.compras = j.compras; S.pags = j.pags || [];
      reindex(); Store.mark(...antigos); Store.markAll(); render(); toast('Backup importado'); posCarga();
    } catch (err) { toast('Arquivo inválido: use um backup exportado por aqui'); }
    t.value = '';
  }
  if (t.dataset.lf === 'd' || t.dataset.lf === 'm') { S.lf[t.dataset.lf] = t.value; S.lf.lim = 80; render(); }
  if (t.dataset.pf) { S.pf[t.dataset.pf] = t.value; render(); }
});

const Recorr = {
