    const nomes = new Set(S.cfg.devs.map(d => d.n)); let n = 0;
    for (const cob of S.cfg.cobr || []) {
      const s = RATEIO_INICIAL[cob.id];
      if (!s || (cob.rateio && cob.rateio.length) || Math.abs((cob.v || 0) - s.v) > 0.01) continue;
      cob.rateio = s.r.filter(([d]) => nomes.has(d)).map(([d, v]) => ({ d, v }));
      if (cob.rateio.length) n++;
    }
    R.semeado = true;
    return n;
  },

  /* uma vez: reaproveita lançamentos manuais que já correspondem a uma cobrança */
  migrar() {
    const R = this.cfg(); if (R.migrado) return 0;
    const { ini, fim } = this.janela(); const usados = new Set(); let n = 0;
    for (const cob of S.cfg.cobr || []) {
      const re = CHAVE_MIGRACAO[cob.id]; if (!re || !cob.rateio) continue;
      for (const r of cob.rateio) for (let mes = ini; mes <= fim; mes = Core.addMonths(mes, 1)) {
        const c = S.compras.find(c => !usados.has(c) && !c.rec && c.d === r.d && c.m === cob.m && c.n === 1 && c.p.length === 1
          && this.mesDe(c) === mes && Math.abs(c.v - r.v) < 0.02 && re.test(c.c) && !/desconto/i.test(c.c));
        if (c) { usados.add(c); c.rec = cob.id; c.man = true; n++; }
      }
    }
    R.migrado = true;
    return n;
  },

  gerar() {
    const R = this.cfg(); const { ini, fim } = this.janela();
    const skip = new Set(R.skip);
    const tem = new Set(S.compras.filter(c => c.rec).map(c => this.chave(c.rec, c.d, this.mesDe(c))));
    let n = 0;
    for (const cob of S.cfg.cobr || []) {
      if (!cob.rateio || !cob.rateio.length) continue;
      const meio = Core.meioDe(S.cfg, cob.m); if (!meio) continue;
      for (let mes = ini; mes <= fim; mes = Core.addMonths(mes, 1)) {
        for (const r of cob.rateio) {
          const k = this.chave(cob.id, r.d, mes);
          if (!r.v || tem.has(k) || skip.has(k)) continue;
          const dt = Core.dataCobranca(S.cfg, cob, mes);
          const venc = Core.dateIn(mes, meio.v || 15);
          S.compras.push({ i: uid('r'), d: r.d, m: cob.m, c: cob.n, dt, v: r.v, n: 1, p: [[1, r.v, venc]], rec: cob.id });
          tem.add(k); n++;
        }
      }
    }
    return n;
  },

  /* depois de mudar valor, dia, cartão ou rateio: refaz os meses que ainda não foram cobrados */
  regenerar(cobId) {
    const cob = (S.cfg.cobr || []).find(c => c.id === cobId);
    const hoje = Core.todayISO(), cur = hoje.slice(0, 7);
    const inicio = cob && Core.dataCobranca(S.cfg, cob, cur) > hoje ? cur : Core.addMonths(cur, 1);
    const antes = S.compras.length;
    S.compras = S.compras.filter(c => !(c.rec === cobId && !c.man && this.mesDe(c) >= inicio));
    const removidos = antes - S.compras.length;
    const R = this.cfg();
    R.skip = R.skip.filter(k => { const [id, , m] = k.split('|'); return !(id === cobId && m >= inicio); });
    const criados = cob ? this.gerar() : 0;
    return removidos + criados;
  },

  renomear(old, novo) {
    (S.cfg.cobr || []).forEach(cb => (cb.rateio || []).forEach(r => { if (r.d === old) r.d = novo; }));
    const R = this.cfg();
    R.skip = R.skip.map(k => { const [a, b, c] = k.split('|'); return b === old ? `${a}|${novo}|${c}` : k; });
  },

  esquecer(c) {
    if (!c.rec) return;
    const R = this.cfg(); const k = this.chave(c.rec, c.d, this.mesDe(c));
    if (!R.skip.includes(k)) R.skip.push(k);
  },
};

const Limpeza = {
  rodando: false,
  cfg() {
    const L = S.cfg.limpeza ??= {};
    L.ativo ??= true; L.meses ??= 5; L.dia ??= 15; L.ultima ??= null; L.hist ??= [];
    return L;
  },
  corte(mes) { return Core.addMonths(mes, -this.cfg().meses); },
  /* data da próxima execução; se já passou, a limpeza está pendente */
  proxima() {
    const L = this.cfg(); const cur = Core.todayISO().slice(0, 7);
    return Core.dateIn(L.ultima === cur ? Core.addMonths(cur, 1) : cur, L.dia);
  },
  devida() {
    const L = this.cfg(); const hoje = Core.todayISO();
    return L.ativo && Number(hoje.slice(8, 10)) >= L.dia && L.ultima !== hoje.slice(0, 7);
  },

  planejar(corte) {
    const compras = [], velhas = new Set();
    for (const c of S.compras) {
      const ps = c.p.filter(p => p[2].slice(0, 7) <= corte);
      if (ps.length) { compras.push({ ...c, p: ps }); velhas.add(c.i); }
    }
    const pags = S.pags.filter(p => p.f <= corte);
    const fat = {};
    for (const [m, v] of Object.entries(S.cfg.fat || {})) if (m <= corte) fat[m] = v;
    const nParc = compras.reduce((s, c) => s + c.p.length, 0);
    return { corte, compras, velhas, pags, fat, nParc, nPag: pags.length, nFat: Object.keys(fat).length };
  },

  aplicar(pl) {
    for (const c of S.compras) if (pl.velhas.has(c.i)) c.p = c.p.filter(p => p[2].slice(0, 7) > pl.corte);
    S.compras = S.compras.filter(c => c.p.length);
    const ids = new Set(pl.pags.map(p => p.i));
    S.pags = S.pags.filter(p => !ids.has(p.i));
    for (const m of Object.keys(pl.fat)) delete S.cfg.fat[m];
    const R = Recorr.cfg();
    R.skip = R.skip.filter(k => k.split('|')[2] > pl.corte);
  },

  /* roda se estiver na data (ou se forçado). Só apaga depois que a cópia foi salva no Drive. */
  async talvez(forcar) {
    const L = this.cfg();
    if (!forcar && !this.devida()) return null;
    if (Store.mode !== 'drive' || Store.precisaClique) return null;
    if (this.rodando) return null;
    this.rodando = true;
    const cur = Core.todayISO().slice(0, 7);
    try {
      const pl = this.planejar(this.corte(cur));
      let arq = null;
      if (pl.nParc || pl.nPag || pl.nFat) {
        const nome = `caderneta-arquivo-ate-${pl.corte}.json`;
        await Cloud.criarArquivo(nome, {
          app: 'caderneta-arquivo', versao: 1, corte: pl.corte, gerado: new Date().toISOString(),
          compras: pl.compras, pags: pl.pags, fat: pl.fat,
        });
        arq = nome;
        this.aplicar(pl);
      }
      L.ultima = cur;
      L.hist.unshift({ em: Core.todayISO(), corte: pl.corte, parc: pl.nParc, pags: pl.nPag, arq });
      L.hist = L.hist.slice(0, 12);
      reindex(); render(); Store.mark();
      return { ...pl, arq };
    } catch (e) {
      console.error(e);
      toast('Limpeza adiada: não consegui salvar a cópia no Drive');
      return null;
    } finally { this.rodando = false; }
  },
};

/* junta um arquivo de limpeza de volta aos dados atuais */
function restaurarArquivo(j) {
  let nc = 0, np = 0;
  const porId = new Map(S.compras.map(c => [c.i, c]));
  for (const c of j.compras || []) {
    const atual = porId.get(c.i);
    if (atual) {
      const tem = new Set(atual.p.map(p => p[0] + '|' + p[2]));
      for (const p of c.p) if (!tem.has(p[0] + '|' + p[2])) { atual.p.push(p); nc++; }
      atual.p.sort((a, b) => a[0] - b[0] || a[2].localeCompare(b[2]));
    } else { S.compras.push(c); porId.set(c.i, c); nc += c.p.length; }
  }
  const ids = new Set(S.pags.map(p => p.i));
  for (const p of j.pags || []) if (!ids.has(p.i)) { S.pags.push(p); np++; }
  for (const [m, v] of Object.entries(j.fat || {})) if (!S.cfg.fat[m]) S.cfg.fat[m] = v;
  return { nc, np };
}

function avisoLimpeza(r) {
  const d = $('#conf');
  d.innerHTML = `<form method="dialog"><div class="dlg-head"><h2>Limpeza do mês concluída</h2></div>
  <div class="dlg-body"><p class="full" style="margin:0">Foram removidas <b>${r.nParc.toLocaleString('pt-BR')}</b> parcelas e <b>${r.nPag.toLocaleString('pt-BR')}</b> pagamentos de faturas até <b>${mesNome(r.corte)}/${r.corte.slice(0, 4)}</b>.
  ${r.arq ? `Uma cópia de tudo foi salva no seu Google Drive como <b>${esc(r.arq)}</b>.` : ''}</p>
  <p class="full small muted" style="margin:0">Compras parceladas continuam com as parcelas que vencem depois disso.</p></div>
  <div class="dlg-foot"><button class="btn primary" value="ok">Entendi</button></div></form>`;
  d.showModal();
}

/* roda depois que os dados do Drive estão carregados */
async function posCarga() {
  if (!S.ready) return;
  let mud = Recorr.semear() + Recorr.migrar() + Recorr.gerar();
  if (mud) { reindex(); render(); Store.mark(); }
  const r = await Limpeza.talvez();
  if (r && (r.nParc || r.nPag)) avisoLimpeza(r);
}
setInterval(() => { if (S.ready && Store.mode === 'drive') posCarga(); }, 60 * 60 * 1000);

</script>
<script>
/* ===== Login Google e gravação no Google Drive ===== */
const GIS = 'https://accounts.google.com/gsi/client';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const API = 'https://www.googleapis.com/drive/v3';
const UP = 'https://www.googleapis.com/upload/drive/v3';
const NOME_ARQ = 'caderneta.json';

/* ID do cliente OAuth deste app. Não é segredo: só funciona a partir da
   origem cadastrada no Google Cloud. Pode ser trocado na tela de configuração. */
const CLIENT_ID_PADRAO = '448501927423-q1f8pq4bp8n79i18h0bpg10lnshc2n9i.apps.googleusercontent.com';

const Auth = {
  token: null, exp: 0, tc: null, lib: null, pedindo: null,
  get clientId() { return localStorage.getItem('caderneta-clientid') || CLIENT_ID_PADRAO; },
  set clientId(v) { localStorage.setItem('caderneta-clientid', v); },
  get jaConectou() { return localStorage.getItem('caderneta-conectou') === '1'; },
  set jaConectou(v) { v ? localStorage.setItem('caderneta-conectou', '1') : localStorage.removeItem('caderneta-conectou'); },
  get origem() { return location.origin; },

  carregar() {
    if (this.lib) return this.lib;
    this.lib = new Promise((ok, falha) => {
      if (window.google && google.accounts && google.accounts.oauth2) return ok();
      const s = document.createElement('script');
      s.src = GIS; s.async = true; s.defer = true;
      s.onload = () => ok();
      s.onerror = () => falha(new Error('Não consegui carregar o login do Google. Verifique a conexão.'));
      document.head.appendChild(s);
    });
    return this.lib;
  },

  /* pede um token. silencioso = sem nenhuma janela; devolve null se precisar de clique */
  async pedir(silencioso) {
    if (!this.clientId) throw new Error('sem client id');
    if (this.pedindo) return this.pedindo;
    await this.carregar();
    this.pedindo = new Promise(resolve => {
      let pronto = false;
      const fim = (v) => { if (pronto) return; pronto = true; this.pedindo = null; resolve(v); };
      try {
        this.tc = google.accounts.oauth2.initTokenClient({
          client_id: this.clientId, scope: SCOPE,
          prompt: silencioso ? 'none' : (this.jaConectou ? '' : 'consent'),
          callback: (r) => {
            if (r && r.access_token) {
              this.token = r.access_token;
              this.exp = Date.now() + ((r.expires_in || 3600) - 300) * 1000;
              this.jaConectou = true;
              fim(this.token);
            } else fim(null);
          },
          error_callback: () => fim(null),
        });
        this.tc.requestAccessToken();
      } catch (e) { console.warn(e); fim(null); }
      setTimeout(() => fim(null), silencioso ? 8000 : 120000);
    });
    return this.pedindo;
  },

  async acessar(silencioso) {
    if (this.token && Date.now() < this.exp) return this.token;
    this.token = null;
    return this.pedir(silencioso);
  },

  sair() {
    const t = this.token;
    this.token = null; this.exp = 0; this.jaConectou = false;
    try { if (t && window.google && google.accounts) google.accounts.oauth2.revoke(t, () => { }); } catch (e) { }
  },
};

const Cloud = {
  id: localStorage.getItem('caderneta-fileid') || null,
  versao: null,
  set fileId(v) { this.id = v; v ? localStorage.setItem('caderneta-fileid', v) : localStorage.removeItem('caderneta-fileid'); },

  async req(url, opts = {}, tentou) {
    const tk = await Auth.acessar(true);
    if (!tk) { const e = new Error('sem sessão'); e.semSessao = true; throw e; }
    const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + tk, ...(opts.headers || {}) } });
    if ((r.status === 401 || r.status === 403) && !tentou) {
      Auth.token = null; Auth.exp = 0;
      const novo = await Auth.acessar(true);
      if (novo) return this.req(url, opts, true);
      const e = new Error('sem sessão'); e.semSessao = true; throw e;
    }
    return r;
  },

  async achar() {
    if (this.id) {
      const r = await this.req(`${API}/files/${this.id}?fields=id,version,modifiedTime,trashed`);
      if (r.ok) { const m = await r.json(); if (!m.trashed) { this.versao = m.version; return m; } }
      this.fileId = null;
    }
    const q = encodeURIComponent(`name='${NOME_ARQ}' and trashed=false`);
    const r = await this.req(`${API}/files?q=${q}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,version,modifiedTime)`);
    if (!r.ok) throw new Error('Google Drive respondeu ' + r.status);
    const j = await r.json();
    if (!j.files || !j.files.length) return null;
    this.fileId = j.files[0].id; this.versao = j.files[0].version;
    return j.files[0];
  },

  async baixar() {
    const m = await this.achar();
    if (!m) return null;
    const r = await this.req(`${API}/files/${this.id}?alt=media`);
    if (!r.ok) throw new Error('Google Drive respondeu ' + r.status);
    return r.json();
  },

  async enviar(dados, forcar) {
    const corpo = JSON.stringify(dados);
    if (!this.id) {
      const meta = { name: NOME_ARQ, mimeType: 'application/json', description: 'Dados da Caderneta — não renomeie' };
      const lim = 'cad' + Math.random().toString(36).slice(2);
      const body = `--${lim}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${lim}\r\nContent-Type: application/json\r\n\r\n${corpo}\r\n--${lim}--`;
      const r = await this.req(`${UP}/files?uploadType=multipart&fields=id,version`, {
        method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${lim}` }, body,
      });
      if (!r.ok) throw new Error('Google Drive respondeu ' + r.status);
      const m = await r.json(); this.fileId = m.id; this.versao = m.version;
      return;
    }
    if (!forcar && this.versao) {
      const c = await this.req(`${API}/files/${this.id}?fields=version`);
      if (c.ok) { const m = await c.json(); if (m.version && m.version !== this.versao) { const e = new Error('conflito'); e.conflito = true; throw e; } }
    }
    const r = await this.req(`${UP}/files/${this.id}?uploadType=media&fields=id,version`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: corpo,
    });
    if (r.status === 404) { this.fileId = null; return this.enviar(dados, forcar); }
    if (!r.ok) throw new Error('Google Drive respondeu ' + r.status);
    const m = await r.json(); this.versao = m.version;
  },

  /* cria um arquivo separado (cópia da limpeza); não mexe no caderneta.json */
  async criarArquivo(nome, dados) {
    const meta = { name: nome, mimeType: 'application/json', description: 'Registros arquivados pela limpeza automática da Caderneta' };
    const lim = 'arq' + Math.random().toString(36).slice(2);
    const body = `--${lim}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${lim}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dados)}\r\n--${lim}--`;
    const r = await this.req(`${UP}/files?uploadType=multipart&fields=id,name`, {
      method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${lim}` }, body,
    });
    if (!r.ok) throw new Error('Google Drive respondeu ' + r.status);
    return r.json();
  },
};

/* ===== Armazenamento ===== */
const Store = {
  mode: 'local', dirty: new Set(), timer: null, busy: false, err: null, ultimo: null, precisaClique: false,
  pacote() { return { app: 'caderneta', versao: 1, cfg: { ...S.cfg, atualizado: new Date().toISOString() }, compras: S.compras, pags: S.pags }; },
  cache(p) { try { localStorage.setItem('caderneta-dados', JSON.stringify(p || this.pacote())); } catch (e) { } },
  lerCache() { try { const r = localStorage.getItem('caderneta-dados'); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  mark() { this.dirty.add('tudo'); status(); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200); },
  markAll() { this.mark(); },

  async flush(forcar) {
    if (!this.dirty.size && !forcar) return;
    if (this.busy) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 600); return; }
    this.busy = true; this.dirty.clear(); status();
    const p = this.pacote();
    this.cache(p);
    if (this.mode === 'drive') {
      try {
        await Cloud.enviar(p, forcar === 'forcar');
        this.err = null; this.precisaClique = false; this.ultimo = new Date();
      } catch (e) {
        console.error(e);
        this.dirty.add('tudo');
        if (e.conflito) { this.err = 'O arquivo mudou em outro aparelho.'; this.busy = false; status(); conflito(); return; }
        if (e.semSessao) { this.precisaClique = true; this.err = 'Acesso ao Google expirou. Salvo neste aparelho.'; }
        else { this.err = 'Sem conexão com o Drive. Salvo neste aparelho; tentando de novo.'; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 15000); }
      }
    } else { this.err = null; this.ultimo = new Date(); }
    this.busy = false; status();
  },

  /* chamado por um clique do usuário: garante token e envia o que estiver pendente */
  async reconectar() {
    const tk = await Auth.acessar(false);
    if (!tk) { toast('Não consegui entrar na conta Google'); return false; }
    this.mode = 'drive'; this.precisaClique = false; this.err = null; status();
    await sincronizar();
    return true;
  },
};

function quandoTxt(d) {
  if (!d) return '';
  const s = Math.round((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'agora';
  if (s < 3600) return `há ${Math.round(s / 60)} min`;
  return d.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
}
function status() {
  const el = $('#save-state'); if (!el) return;
  el.classList.toggle('err', !!Store.err);
  if (Store.precisaClique) el.innerHTML = `Alterações guardadas aqui.<br><button class="btn link small" data-act="conectar">Reconectar ao Google Drive</button>`;
  else if (Store.err) el.innerHTML = esc(Store.err);
  else if (Store.busy || Store.dirty.size) el.innerHTML = 'Salvando…';
  else if (Store.mode === 'drive') el.innerHTML = `<b>Salvo no Google Drive</b> ${quandoTxt(Store.ultimo)}`;
  else el.innerHTML = `<b>Salvo neste aparelho</b><br><button class="btn link small" data-act="conectar">Conectar ao Google Drive</button>`;
}
window.addEventListener('beforeunload', e => { if (Store.dirty.size || Store.busy) e.preventDefault(); });
window.addEventListener('online', () => { if (Store.dirty.size) Store.flush(); });

async function conflito() {
  const d = $('#conf');
  d.innerHTML = `<form method="dialog"><div class="dlg-head"><h2>Versões diferentes</h2></div>
  <div class="dlg-body"><p class="full" style="margin:0">A Caderneta no Google Drive foi alterada em outro aparelho depois que esta página abriu. Escolha qual versão vale.</p></div>
  <div class="dlg-foot"><button class="btn" value="nuvem">Usar a do Drive</button><button class="btn primary" value="aqui">Manter a deste aparelho</button></div></form>`;
  d.showModal();
  d.onclose = async () => {
    if (d.returnValue === 'aqui') { Store.err = null; await Store.flush('forcar'); }
    else { try { const j = await Cloud.baixar(); if (j && j.cfg) { aplicar(j); Store.cache(j); Store.dirty.clear(); Store.ultimo = new Date(); toast('Versão do Drive carregada'); } Store.err = null; status(); } catch (e) { toast('Não consegui baixar agora'); return; } }
    await posCarga();
  };
}

/* compara o que está no Drive com o que está aqui */
async function sincronizar() {
  let j = null;
  try { j = await Cloud.baixar(); }
  catch (e) {
    console.error(e);
    if (e.semSessao) { Store.precisaClique = true; Store.mode = 'drive'; }
    else Store.err = 'Não consegui ler o Drive: ' + e.message;
    status(); return;
  }
  Store.mode = 'drive';
  const local = S.ready ? Store.pacote() : Store.lerCache();
  const tLocal = local && local.cfg && local.cfg.atualizado;
  const tDrive = j && j.cfg && j.cfg.atualizado;
  if (j && j.cfg) {
    if (!local || !tLocal || (tDrive && tDrive > tLocal && !Store.dirty.size)) {
      aplicar(j); Store.cache(j); Store.ultimo = new Date(); Store.err = null; status(); await posCarga(); return;
    }
    if (Store.dirty.size && tDrive && tLocal && tDrive > tLocal) { Store.err = null; status(); conflito(); return; }
    if (!S.ready) aplicar(local);
    if (tLocal && (!tDrive || tLocal > tDrive)) { Store.mark(); await posCarga(); return; }
    Store.ultimo = new Date(); Store.err = null; status(); await posCarga(); return;
  }
  // nada no Drive ainda
  if (local && local.cfg) { if (!S.ready) aplicar(local); Store.mark(); toast('Enviando seus dados para o Drive'); await posCarga(); return; }
  if (!S.ready) telaPrimeiraVez();
  status();
}

/* ===== Telas de entrada ===== */
function telaConfig(msg) {
  $('#app').innerHTML = `<div class="welcome">
    <h1>Caderneta</h1>
    <p>Para guardar os dados no seu Google Drive, informe o <b>ID do cliente</b> que você criou no Google Cloud Console.</p>
    ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
    <label class="field" style="margin:16px 0">ID do cliente<input id="cid" value="${esc(Auth.clientId)}" placeholder="000000000000-xxxxxxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false"></label>
    <p class="small muted">Endereço a cadastrar no Google Cloud como <b>origem JavaScript autorizada</b>, sem barra no final:<br><code>${esc(Auth.origem)}</code></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
      <button class="btn primary" id="entrar">Salvar e entrar com o Google</button>
      <button class="btn" id="so-local">Usar só neste aparelho</button>
      ${localStorage.getItem('caderneta-clientid') ? `<button class="btn link" id="padrao">Voltar ao ID original</button>` : ''}</div>
    <div id="save-state" class="save-state" style="padding:14px 0"></div></div>`;
  $('#entrar').onclick = async () => {
    const v = $('#cid').value.trim();
    if (!/\.apps\.googleusercontent\.com$/.test(v)) { toast('O ID do cliente termina em .apps.googleusercontent.com'); return; }
    Auth.clientId = v;
    const tk = await Auth.acessar(false);
    if (!tk) { telaConfig('Não consegui entrar. Confira se o ID está certo e se o endereço acima está cadastrado como origem JavaScript autorizada.'); return; }
    $('#app').innerHTML = '<div class="empty" style="padding-top:120px">Carregando…</div>';
    await sincronizar();
  };
  $('#so-local').onclick = () => abrirLocal();
  const b = $('#padrao'); if (b) b.onclick = () => { localStorage.removeItem('caderneta-clientid'); telaConfig('Voltou para o ID original do app.'); };
}
function telaLogin(msg) {
  $('#app').innerHTML = `<div class="welcome">
    <h1>Caderneta</h1>
    <p>Cartões, empréstimos e planejamento, com os dados guardados no seu Google Drive.</p>
    ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
      <button class="btn primary" id="entrar">Entrar com o Google</button>
      <button class="btn" id="so-local">Usar só neste aparelho</button>
      <button class="btn link" id="trocar">Trocar o ID do cliente</button></div>
    <div id="save-state" class="save-state" style="padding:14px 0"></div></div>`;
  $('#entrar').onclick = async () => {
    const tk = await Auth.acessar(false);
    if (!tk) { telaLogin('O Google não liberou o acesso. Se uma janela foi bloqueada, permita janelas pop-up para este endereço e tente de novo.'); return; }
    $('#app').innerHTML = '<div class="empty" style="padding-top:120px">Carregando…</div>';
    await sincronizar();
  };
  $('#so-local').onclick = () => abrirLocal();
  $('#trocar').onclick = () => telaConfig();
}
function telaPrimeiraVez() {
  $('#app').innerHTML = `<div class="welcome">
    <h1>Tudo pronto</h1>
    <p>${Store.mode === 'drive' ? 'Sua conta está conectada, e ainda não há uma Caderneta no Drive.' : 'Vamos começar.'} Importe um backup (o arquivo <b>.json</b> exportado pela Caderneta) ou comece do zero.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
      <label class="btn primary">Importar backup (.json)<input type="file" accept=".json,application/json" id="imp-json" hidden></label>
      <button class="btn" id="zero">Começar do zero</button></div>
    <div id="save-state" class="save-state" style="padding:14px 0"></div></div>`;
  $('#zero').onclick = () => { S.cfg = DEFAULT_CFG(); S.compras = []; S.pags = []; iniciar(); Store.mark(); };
}
function aplicar(j) {
  S.cfg = j.cfg; S.compras = j.compras || []; S.pags = j.pags || [];
  if (S.ready) { reindex(); render(); } else iniciar();
}
function iniciar() {
  reindex(); S.ready = true;
  S.cfg.cobr ??= []; S.cfg.fat ??= {}; S.cfg.plan ??= DEFAULT_CFG().plan;
  const vistos = new Set();
  for (const it of S.cfg.plan.itens) { if (!it.id || vistos.has(it.id)) { it.id = uid('i'); Store.dirty.add('tudo'); } vistos.add(it.id); }
  shell(); render();
}
function abrirLocal() {
  Store.mode = 'local';
  const cache = Store.lerCache();
  if (cache && cache.cfg) { aplicar(cache); posCarga(); } else telaPrimeiraVez();
}

async function boot() {
  $('#app').innerHTML = '<div class="empty" style="padding-top:120px">Carregando…</div>';
  const cache = Store.lerCache();
  if (!Auth.clientId) { if (cache && cache.cfg) { abrirLocal(); status(); } else telaConfig(); return; }
  if (!Auth.jaConectou) { if (cache && cache.cfg) { abrirLocal(); status(); } else telaLogin(); return; }
  // já conectou antes: abre com a cópia local e tenta renovar o acesso sem interromper
  if (cache && cache.cfg) {
    aplicar(cache); Store.mode = 'drive'; Store.precisaClique = true; status();
    const tk = await Auth.acessar(true);
    if (!tk) { status(); return; }
    Store.precisaClique = false; status();
    await sincronizar();
    return;
  }
  const tk = await Auth.acessar(true);
  if (!tk) return telaLogin();
  await sincronizar();
}
document.addEventListener('change', async e => {
  if (S.ready || e.target.id !== 'imp-json') return;
  e.stopPropagation();
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (j.app !== 'caderneta' || !j.cfg) throw 0;
    aplicar(j); Store.mark(); toast('Backup importado'); await posCarga();
  } catch (err) { toast('Arquivo inválido'); }
}, true);
boot();

</script>
</body>
</html>
